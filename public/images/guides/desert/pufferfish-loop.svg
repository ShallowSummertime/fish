<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Pufferfish combat loop</title><desc id="d">Pufferfish fight diagram showing space, ranged pressure, the observed later poison-gas phase after health is reduced, and safe trophy recovery.</desc><rect width="1200" height="675" fill="#17252e"/><text x="70" y="85" fill="#77d5c7" font-family="system-ui,sans-serif" font-size="22" font-weight="700">PUFFERFISH · PATCH 1.0.9 OBSERVATION</text><text x="70" y="135" fill="white" font-family="system-ui,sans-serif" font-size="40" font-weight="800">Give the inflated body room</text><g font-family="system-ui,sans-serif"><circle cx="220" cy="355" r="105" fill="#295b68" stroke="#77d5c7" stroke-width="18"/><circle cx="600" cy="355" r="135" fill="#694f73" stroke="#c79cdb" stroke-width="18"/><circle cx="990" cy="355" r="105" fill="#4d6a3b" stroke="#aad27f" stroke-width="18"/><g fill="white" font-size="24" font-weight="750" text-anchor="middle"><text x="220" y="345">OPEN SPACE</text><text x="600" y="345">GAS PHASE</text><text x="990" y="345">SAFE FINISH</text></g><g fill="#dce7ea" font-size="17" text-anchor="middle"><text x="220" y="380">do not crowd</text><text x="600" y="380">later phase; no threshold</text><text x="990" y="380">wait, then recover</text></g></g><rect x="70" y="550" width="1060" height="68" rx="14" fill="#243844"/><text x="100" y="592" fill="#fff" font-family="system-ui,sans-serif" font-size="20">No exact gas radius, tick damage, health value, or weapon requirement is claimed.</text></svg>
