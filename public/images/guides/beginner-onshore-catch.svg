<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Pull catches away from the shore</title><desc id="desc">An original tactical diagram of a player reeling a catch inland before attacking it, keeping it farther from the water.</desc><rect width="1200" height="675" fill="#061b24"/><path d="M0 0h475c64 102 75 205 8 320-66 113-66 233-2 355H0Z" fill="#0a3a45"/><path d="M475 0c67 104 79 207 8 320-65 107-63 228-10 355" fill="none" stroke="#78d8bb" stroke-width="7" stroke-dasharray="18 14"/><path d="M498 334C681 213 823 170 1080 196" fill="none" stroke="#f2b84b" stroke-width="10" stroke-linecap="round"/><polygon points="1078,177 1141,191 1090,231" fill="#f2b84b"/><g font-family="Arial,sans-serif"><text x="78" y="90" font-size="24" fill="#78d8bb" letter-spacing="3">WATERLINE</text><text x="570" y="112" font-size="30" font-weight="700" fill="#e9e6d5">REEL INLAND FIRST</text><text x="570" y="150" font-size="21" fill="#b7c8c1">Give yourself room before the catch turns back.</text><circle cx="514" cy="334" r="36" fill="#ed8064"/><path d="M490 386h49l-25 84z" fill="#ed8064"/><path d="M550 373l86-45" stroke="#e9e6d5" stroke-width="8"/><circle cx="1045" cy="195" r="48" fill="#78d8bb"/><path d="M1012 196c22-31 46-31 67 0-17 22-43 25-67 0Z" fill="#06212a"/><text x="835" y="290" font-size="19" fill="#f2b84b">safer working space</text><text x="562" y="494" font-size="19" fill="#ed8064">1. hook</text><text x="785" y="423" font-size="19" fill="#f2b84b">2. pull clear</text><text x="1005" y="144" font-size="19" fill="#78d8bb">3. finish / carry</text></g></svg>
