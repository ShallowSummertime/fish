<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Spider Crab combat loop</title><desc id="desc">An original four-stage loop: position at mid range, sidestep the charge, attack while the crab is stunned, then reset.</desc><rect width="1200" height="675" fill="#241a1b"/><g fill="none" stroke="#ed8064" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 16"><path d="M259 192h184c55 0 88 33 88 88v5"/><path d="M695 295v-5c0-55 33-88 88-88h163"/><path d="M934 403H788c-57 0-89 32-89 89"/><path d="M507 492c0-57-31-89-89-89H255"/></g><g font-family="Arial,sans-serif"><g transform="translate(214 198)"><circle r="90" fill="#0b2a34" stroke="#f2b84b" stroke-width="4"/><text y="-10" text-anchor="middle" font-size="21" fill="#78d8bb">01</text><text y="26" text-anchor="middle" font-size="26" font-weight="700" fill="#e9e6d5">SET SPACE</text><text y="56" text-anchor="middle" font-size="16" fill="#b7c8c1">stay mobile</text></g><g transform="translate(610 198)"><circle r="90" fill="#0b2a34" stroke="#f2b84b" stroke-width="4"/><text y="-10" text-anchor="middle" font-size="21" fill="#78d8bb">02</text><text y="26" text-anchor="middle" font-size="26" font-weight="700" fill="#e9e6d5">SIDESTEP</text><text y="56" text-anchor="middle" font-size="16" fill="#b7c8c1">avoid the lunge</text></g><g transform="translate(986 403)"><circle r="90" fill="#0b2a34" stroke="#f2b84b" stroke-width="4"/><text y="-10" text-anchor="middle" font-size="21" fill="#78d8bb">03</text><text y="26" text-anchor="middle" font-size="26" font-weight="700" fill="#e9e6d5">PUNISH</text><text y="56" text-anchor="middle" font-size="16" fill="#b7c8c1">during self-stun</text></g><g transform="translate(610 512)"><circle r="90" fill="#0b2a34" stroke="#f2b84b" stroke-width="4"/><text y="-10" text-anchor="middle" font-size="21" fill="#78d8bb">04</text><text y="26" text-anchor="middle" font-size="26" font-weight="700" fill="#e9e6d5">BACK OFF</text><text y="56" text-anchor="middle" font-size="16" fill="#b7c8c1">repeat cleanly</text></g><path d="M410 572h212" stroke="#78d8bb" stroke-width="3"/><text x="78" y="616" font-size="20" fill="#b7c8c1">Do not trade hits. One clean loop is better than forcing damage.</text></g></svg>
