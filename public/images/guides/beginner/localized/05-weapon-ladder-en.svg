<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">FROM FISTS TO FIREPOWER</title><desc id="desc">Original English How to Fish beginner guide infographic.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#062231"/><stop offset="1" stop-color="#07141e"/></linearGradient><style>.k{font:700 24px Arial,sans-serif;letter-spacing:4px;fill:#ff7d67}.part{font:900 28px Arial,sans-serif;fill:#09212e}.title{font:900 58px Arial,sans-serif;fill:#f7f4e8}.lead{font:400 27px Arial,sans-serif;fill:#bcd0d8}.num{font:900 38px Arial,sans-serif;fill:#09212e}.head{font:800 29px Arial,sans-serif;fill:#fff}.body{font:400 24px Arial,sans-serif;fill:#c9d6dc}.foot{font:800 26px Arial,sans-serif;fill:#09212e;letter-spacing:1px}</style></defs><rect width="1200" height="1500" fill="url(#bg)"/><circle cx="1100" cy="80" r="240" fill="#ff7d67" opacity=".08"/><circle cx="70" cy="1410" r="260" fill="#ff7d67" opacity=".06"/><text x="70" y="76" class="k">HOW TO FISH GAME GUIDE</text><rect x="70" y="120" width="170" height="55" rx="14" fill="#ff7d67"/><text x="155" y="158" text-anchor="middle" class="part">PART 04</text><text x="70" y="248" class="title">FROM FISTS TO FIREPOWER</text><text x="70" y="300" class="lead">Buy damage upgrades when the current tool makes every catch take too long.</text><g transform="translate(70 360)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#ff7d67"/><text x="70" y="92" text-anchor="middle" class="num">1</text><text x="140" y="58" class="head">BARE FISTS — 3 DMG</text><text x="140" y="96" class="body">Free and always available, but inefficient against large creatures</text><text x="140" y="130" class="body">and bosses.</text></g><g transform="translate(70 550)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#ff7d67"/><text x="70" y="92" text-anchor="middle" class="num">2</text><text x="140" y="58" class="head">BRASS KNUCKLES — $24</text><text x="140" y="96" class="body">A small early upgrade with limited range and stagger.</text></g><g transform="translate(70 740)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#ff7d67"/><text x="70" y="92" text-anchor="middle" class="num">3</text><text x="140" y="58" class="head">SURVIVAL KNIFE — $45</text><text x="140" y="96" class="body">16 base damage. Anvil tiers raise it to 18, 20, then 22 damage.</text></g><g transform="translate(70 930)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#ff7d67"/><text x="70" y="92" text-anchor="middle" class="num">4</text><text x="140" y="58" class="head">PISTOL — $50</text><text x="140" y="96" class="body">30 base damage and a useful first ranged option. Ammo upgrades cost</text><text x="140" y="130" class="body">$25 per tier.</text></g><g transform="translate(70 1120)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#ff7d67"/><text x="70" y="92" text-anchor="middle" class="num">5</text><text x="140" y="58" class="head">SHOTGUN / SMG</text><text x="140" y="96" class="body">Shotgun controls clustered small enemies. The $650 SMG has a</text><text x="140" y="130" class="body">40-round magazine but needs recoil control.</text></g><rect x="70" y="1345" width="1060" height="86" rx="25" fill="#ff7d67"/><text x="600" y="1399" text-anchor="middle" class="foot">NEXT: ENDGAME GUNS &amp; DEATH RISK</text></svg>