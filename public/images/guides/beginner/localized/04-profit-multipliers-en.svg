<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">RAISE VALUE BEFORE YOU SELL</title><desc id="desc">Original English How to Fish beginner guide infographic.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#062231"/><stop offset="1" stop-color="#07141e"/></linearGradient><style>.k{font:700 24px Arial,sans-serif;letter-spacing:4px;fill:#ffb449}.part{font:900 28px Arial,sans-serif;fill:#09212e}.title{font:900 58px Arial,sans-serif;fill:#f7f4e8}.lead{font:400 27px Arial,sans-serif;fill:#bcd0d8}.num{font:900 38px Arial,sans-serif;fill:#09212e}.head{font:800 29px Arial,sans-serif;fill:#fff}.body{font:400 24px Arial,sans-serif;fill:#c9d6dc}.foot{font:800 26px Arial,sans-serif;fill:#09212e;letter-spacing:1px}</style></defs><rect width="1200" height="1500" fill="url(#bg)"/><circle cx="1100" cy="80" r="240" fill="#ffb449" opacity=".08"/><circle cx="70" cy="1410" r="260" fill="#ffb449" opacity=".06"/><text x="70" y="76" class="k">HOW TO FISH GAME GUIDE</text><rect x="70" y="120" width="170" height="55" rx="14" fill="#ffb449"/><text x="155" y="158" text-anchor="middle" class="part">PART 03</text><text x="70" y="248" class="title">RAISE VALUE BEFORE YOU SELL</text><text x="70" y="300" class="lead">Add a stunt multiplier, then stop cooking at the value peak.</text><g transform="translate(70 360)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#ffb449"/><text x="70" y="92" text-anchor="middle" class="num">1</text><text x="140" y="58" class="head">THROW</text><text x="140" y="96" class="body">After subduing a creature, press Q to toss it high.</text></g><g transform="translate(70 550)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#ffb449"/><text x="70" y="92" text-anchor="middle" class="num">2</text><text x="140" y="58" class="head">SPIN &amp; SHOOT</text><text x="140" y="96" class="body">Turn before the hit and shoot it in mid-air to build the trick-shot</text><text x="140" y="130" class="body">multiplier.</text></g><g transform="translate(70 740)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#ffb449"/><text x="70" y="92" text-anchor="middle" class="num">3</text><text x="140" y="58" class="head">MULTIPLIER</text><text x="140" y="96" class="body">The displayed bonus can climb from 1.2× toward 5× with cleaner</text><text x="140" y="130" class="body">stunts.</text></g><g transform="translate(70 930)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#ffb449"/><text x="70" y="92" text-anchor="middle" class="num">4</text><text x="140" y="58" class="head">GRILL</text><text x="140" y="96" class="body">Cooking unlocks after the early crocodile task on the tropical</text><text x="140" y="130" class="body">island. Hold the shown cook key and watch the meter.</text></g><g transform="translate(70 1120)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#ffb449"/><text x="70" y="92" text-anchor="middle" class="num">5</text><text x="140" y="58" class="head">STOP AT THE PEAK</text><text x="140" y="96" class="body">Best grill value is around 1.5×. Burnt catches can fall to $0.</text></g><rect x="70" y="1345" width="1060" height="86" rx="25" fill="#ffb449"/><text x="600" y="1399" text-anchor="middle" class="foot">SELL ONLY AFTER THE VALUE BOOST</text></svg>