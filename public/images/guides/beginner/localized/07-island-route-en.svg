<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">THE FIVE-ISLAND ROUTE</title><desc id="desc">Original English How to Fish beginner guide infographic.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#062231"/><stop offset="1" stop-color="#07141e"/></linearGradient><style>.k{font:700 24px Arial,sans-serif;letter-spacing:4px;fill:#50d6e8}.part{font:900 28px Arial,sans-serif;fill:#09212e}.title{font:900 58px Arial,sans-serif;fill:#f7f4e8}.lead{font:400 27px Arial,sans-serif;fill:#bcd0d8}.num{font:900 38px Arial,sans-serif;fill:#09212e}.head{font:800 29px Arial,sans-serif;fill:#fff}.body{font:400 24px Arial,sans-serif;fill:#c9d6dc}.foot{font:800 26px Arial,sans-serif;fill:#09212e;letter-spacing:1px}</style></defs><rect width="1200" height="1500" fill="url(#bg)"/><circle cx="1100" cy="80" r="240" fill="#50d6e8" opacity=".08"/><circle cx="70" cy="1410" r="260" fill="#50d6e8" opacity=".06"/><text x="70" y="76" class="k">HOW TO FISH GAME GUIDE</text><rect x="70" y="120" width="170" height="55" rx="14" fill="#50d6e8"/><text x="155" y="158" text-anchor="middle" class="part">PART 06</text><text x="70" y="248" class="title">THE FIVE-ISLAND ROUTE</text><text x="70" y="300" class="lead">Hand each boss objective to the key NPC to reveal the next destination.</text><g transform="translate(70 360)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#50d6e8"/><text x="70" y="92" text-anchor="middle" class="num">1</text><text x="140" y="58" class="head">LIGHTHOUSE — ISLAND 1</text><text x="140" y="96" class="body">Summon Spider Crab with the Empty Beer Can. Return its Meat to the</text><text x="140" y="130" class="body">keeper for Boat Keys; Forest appears as a green Radar marker.</text></g><g transform="translate(70 550)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#50d6e8"/><text x="70" y="92" text-anchor="middle" class="num">2</text><text x="140" y="58" class="head">FOREST — ISLAND 2</text><text x="140" y="96" class="body">Give three Leeches to the lake NPC. Defeat Giant Piranha and return</text><text x="140" y="130" class="body">its Skeleton; Desert appears as a yellow marker.</text></g><g transform="translate(70 740)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#50d6e8"/><text x="70" y="92" text-anchor="middle" class="num">3</text><text x="140" y="58" class="head">DESERT — ISLAND 3</text><text x="140" y="96" class="body">Complete the Tourist request for a Carrot. Defeat Pufferfish and</text><text x="140" y="130" class="body">return its Fin; Rocks appears as a red marker.</text></g><g transform="translate(70 930)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#50d6e8"/><text x="70" y="92" text-anchor="middle" class="num">4</text><text x="140" y="58" class="head">ROCKS — ISLAND 4</text><text x="140" y="96" class="body">Catch Tuna with a Professional Boss Lure and place it on land.</text><text x="140" y="130" class="body">Defeat Albatross and return its Head for the final coordinates.</text></g><g transform="translate(70 1120)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#50d6e8"/><text x="70" y="92" text-anchor="middle" class="num">5</text><text x="140" y="58" class="head">VOLCANO — ISLAND 5</text><text x="140" y="96" class="body">Follow the pink marker. Complete the scientist route, defeat the</text><text x="140" y="130" class="body">Bowhead Whale chain, and secure the military boat key.</text></g><rect x="70" y="1345" width="1060" height="86" rx="25" fill="#50d6e8"/><text x="600" y="1399" text-anchor="middle" class="foot">KEEP THE COORDINATE DRIVE AFTER HAND-IN</text></svg>