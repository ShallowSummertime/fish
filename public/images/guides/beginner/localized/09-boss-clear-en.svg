<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">FIVE-ISLAND BOSS CLEAR</title><desc id="desc">Original English How to Fish beginner guide infographic.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#062231"/><stop offset="1" stop-color="#07141e"/></linearGradient><style>.k{font:700 24px Arial,sans-serif;letter-spacing:4px;fill:#ff5d4d}.part{font:900 28px Arial,sans-serif;fill:#09212e}.title{font:900 58px Arial,sans-serif;fill:#f7f4e8}.lead{font:400 27px Arial,sans-serif;fill:#bcd0d8}.num{font:900 38px Arial,sans-serif;fill:#09212e}.head{font:800 29px Arial,sans-serif;fill:#fff}.body{font:400 24px Arial,sans-serif;fill:#c9d6dc}.foot{font:800 26px Arial,sans-serif;fill:#09212e;letter-spacing:1px}</style></defs><rect width="1200" height="1500" fill="url(#bg)"/><circle cx="1100" cy="80" r="240" fill="#ff5d4d" opacity=".08"/><circle cx="70" cy="1410" r="260" fill="#ff5d4d" opacity=".06"/><text x="70" y="76" class="k">HOW TO FISH GAME GUIDE</text><rect x="70" y="120" width="170" height="55" rx="14" fill="#ff5d4d"/><text x="155" y="158" text-anchor="middle" class="part">PART 08</text><text x="70" y="248" class="title">FIVE-ISLAND BOSS CLEAR</text><text x="70" y="300" class="lead">Treat every boss as a hand-off: summon, control, defeat, then secure the quest item.</text><g transform="translate(70 360)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#ff5d4d"/><text x="70" y="92" text-anchor="middle" class="num">1</text><text x="140" y="58" class="head">LIGHTHOUSE — SPIDER CRAB</text><text x="140" y="96" class="body">Summon with the Empty Beer Can. Sidestep its charge, attack during</text><text x="140" y="130" class="body">the stun, then return its Shell for the Boat Keys.</text></g><g transform="translate(70 550)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#ff5d4d"/><text x="70" y="92" text-anchor="middle" class="num">2</text><text x="140" y="58" class="head">FOREST — GIANT PIRANHA</text><text x="140" y="96" class="body">Use the Modified Leech. Clear its smaller attackers, defeat the</text><text x="140" y="130" class="body">boss, and return its Skeleton for Desert coordinates.</text></g><g transform="translate(70 740)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#ff5d4d"/><text x="70" y="92" text-anchor="middle" class="num">3</text><text x="140" y="58" class="head">DESERT — PUFFERFISH</text><text x="140" y="96" class="body">Use the Carrot. Keep distance from its rolling attack, then return</text><text x="140" y="130" class="body">its Fin for Rocks coordinates.</text></g><g transform="translate(70 930)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#ff5d4d"/><text x="70" y="92" text-anchor="middle" class="num">4</text><text x="140" y="58" class="head">ROCKS — ALBATROSS</text><text x="140" y="96" class="body">Catch Tuna with the Professional Boss Lure and leave it on land. Use</text><text x="140" y="130" class="body">cover, defeat Albatross, and return its Head.</text></g><g transform="translate(70 1120)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#ff5d4d"/><text x="70" y="92" text-anchor="middle" class="num">5</text><text x="140" y="58" class="head">VOLCANO — WHALE FINALE</text><text x="140" y="96" class="body">Five native catches → Fish Bucket → Bowhead body/crater → Mutated</text><text x="140" y="130" class="body">Bowhead → Whale Fin → scientist → military boat key.</text></g><rect x="70" y="1345" width="1060" height="86" rx="25" fill="#ff5d4d"/><text x="600" y="1399" text-anchor="middle" class="foot">100% COMPLETE — ESCAPE THE ISLANDS</text></svg>