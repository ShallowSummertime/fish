<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">BAIT CONTROLS THE CATCH</title><desc id="desc">Original English How to Fish beginner guide infographic.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#062231"/><stop offset="1" stop-color="#07141e"/></linearGradient><style>.k{font:700 24px Arial,sans-serif;letter-spacing:4px;fill:#45c8f0}.part{font:900 28px Arial,sans-serif;fill:#09212e}.title{font:900 58px Arial,sans-serif;fill:#f7f4e8}.lead{font:400 27px Arial,sans-serif;fill:#bcd0d8}.num{font:900 38px Arial,sans-serif;fill:#09212e}.head{font:800 29px Arial,sans-serif;fill:#fff}.body{font:400 24px Arial,sans-serif;fill:#c9d6dc}.foot{font:800 26px Arial,sans-serif;fill:#09212e;letter-spacing:1px}</style></defs><rect width="1200" height="1500" fill="url(#bg)"/><circle cx="1100" cy="80" r="240" fill="#45c8f0" opacity=".08"/><circle cx="70" cy="1410" r="260" fill="#45c8f0" opacity=".06"/><text x="70" y="76" class="k">HOW TO FISH GAME GUIDE</text><rect x="70" y="120" width="170" height="55" rx="14" fill="#45c8f0"/><text x="155" y="158" text-anchor="middle" class="part">PART 02</text><text x="70" y="248" class="title">BAIT CONTROLS THE CATCH</text><text x="70" y="300" class="lead">Choose the lure for the target, then keep it moving after the cast.</text><g transform="translate(70 360)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#45c8f0"/><text x="70" y="92" text-anchor="middle" class="num">1</text><text x="140" y="58" class="head">HOT DOG — $1</text><text x="140" y="96" class="body">Auto-attaches to the rod and can attract colorful variants.</text></g><g transform="translate(70 550)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#45c8f0"/><text x="70" y="92" text-anchor="middle" class="num">2</text><text x="140" y="58" class="head">EMPTY BEER CAN</text><text x="140" y="96" class="body">Drink a beer to obtain the can. Use it for the Long-Legged Spider</text><text x="140" y="130" class="body">Crab encounter.</text></g><g transform="translate(70 740)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#45c8f0"/><text x="70" y="92" text-anchor="middle" class="num">3</text><text x="140" y="58" class="head">LEECH — FOREST</text><text x="140" y="96" class="body">Give it to the woman by the cabin to prepare the Giant Piranha lure.</text><text x="140" y="130" class="body">Eating one heals a little, then poisons you.</text></g><g transform="translate(70 930)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#45c8f0"/><text x="70" y="92" text-anchor="middle" class="num">4</text><text x="140" y="58" class="head">CARROT</text><text x="140" y="96" class="body">Unlocked through the endangered seahorse task; used for Tropical</text><text x="140" y="130" class="body">Pufferfish.</text></g><g transform="translate(70 1120)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#45c8f0"/><text x="70" y="92" text-anchor="middle" class="num">5</text><text x="140" y="58" class="head">WORK THE LURE</text><text x="140" y="96" class="body">Reel or walk backward so the lure moves. Fast, dense surface ripples</text><text x="140" y="130" class="body">can signal a better target.</text></g><rect x="70" y="1345" width="1060" height="86" rx="25" fill="#45c8f0"/><text x="600" y="1399" text-anchor="middle" class="foot">NEXT: TRICK SHOTS &amp; GRILL VALUE</text></svg>