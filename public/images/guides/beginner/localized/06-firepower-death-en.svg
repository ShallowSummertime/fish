<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">FIREPOWER &amp; DEATH RISK</title><desc id="desc">Original English How to Fish beginner guide infographic.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#062231"/><stop offset="1" stop-color="#07141e"/></linearGradient><style>.k{font:700 24px Arial,sans-serif;letter-spacing:4px;fill:#a88bff}.part{font:900 28px Arial,sans-serif;fill:#09212e}.title{font:900 58px Arial,sans-serif;fill:#f7f4e8}.lead{font:400 27px Arial,sans-serif;fill:#bcd0d8}.num{font:900 38px Arial,sans-serif;fill:#09212e}.head{font:800 29px Arial,sans-serif;fill:#fff}.body{font:400 24px Arial,sans-serif;fill:#c9d6dc}.foot{font:800 26px Arial,sans-serif;fill:#09212e;letter-spacing:1px}</style></defs><rect width="1200" height="1500" fill="url(#bg)"/><circle cx="1100" cy="80" r="240" fill="#a88bff" opacity=".08"/><circle cx="70" cy="1410" r="260" fill="#a88bff" opacity=".06"/><text x="70" y="76" class="k">HOW TO FISH GAME GUIDE</text><rect x="70" y="120" width="170" height="55" rx="14" fill="#a88bff"/><text x="155" y="158" text-anchor="middle" class="part">PART 05</text><text x="70" y="248" class="title">FIREPOWER &amp; DEATH RISK</text><text x="70" y="300" class="lead">Late-game damage is expensive; recovery planning matters just as much.</text><g transform="translate(70 360)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#a88bff"/><text x="70" y="92" text-anchor="middle" class="num">1</text><text x="140" y="58" class="head">SNIPER — $3,800</text><text x="140" y="96" class="body">High burst damage and strong precision; pairs well with mid-air</text><text x="140" y="130" class="body">trick shots.</text></g><g transform="translate(70 550)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#a88bff"/><text x="70" y="92" text-anchor="middle" class="num">2</text><text x="140" y="58" class="head">ASSAULT RIFLE</text><text x="140" y="96" class="body">A Volcano-stage main weapon whose upgrades can reach 100 damage per</text><text x="140" y="130" class="body">shot.</text></g><g transform="translate(70 740)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#a88bff"/><text x="70" y="92" text-anchor="middle" class="num">3</text><text x="140" y="58" class="head">ATTACHMENTS</text><text x="140" y="96" class="body">Extended mag $100 • compensator $600 • laser/red dot $100 •</text><text x="140" y="130" class="body">suppressor $100.</text></g><g transform="translate(70 930)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#a88bff"/><text x="70" y="92" text-anchor="middle" class="num">4</text><text x="140" y="58" class="head">DYNAMITE — $25</text><text x="140" y="96" class="body">Large area damage. A bad cook or throw can down you or a teammate.</text></g><g transform="translate(70 1120)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#a88bff"/><text x="70" y="92" text-anchor="middle" class="num">5</text><text x="140" y="58" class="head">DEATH DROPS</text><text x="140" y="96" class="body">Equipped gear and most carried items drop where you fall. White</text><text x="140" y="130" class="body">markers help recovery; deep water and grass make it harder.</text></g><rect x="70" y="1345" width="1060" height="86" rx="25" fill="#a88bff"/><text x="600" y="1399" text-anchor="middle" class="foot">BANK VALUE BEFORE A HIGH-RISK RUN</text></svg>