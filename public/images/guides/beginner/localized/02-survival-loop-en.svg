<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">YOUR FIRST SURVIVAL LOOP</title><desc id="desc">Original English How to Fish beginner guide infographic.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#062231"/><stop offset="1" stop-color="#07141e"/></linearGradient><style>.k{font:700 24px Arial,sans-serif;letter-spacing:4px;fill:#65d6ad}.part{font:900 28px Arial,sans-serif;fill:#09212e}.title{font:900 58px Arial,sans-serif;fill:#f7f4e8}.lead{font:400 27px Arial,sans-serif;fill:#bcd0d8}.num{font:900 38px Arial,sans-serif;fill:#09212e}.head{font:800 29px Arial,sans-serif;fill:#fff}.body{font:400 24px Arial,sans-serif;fill:#c9d6dc}.foot{font:800 26px Arial,sans-serif;fill:#09212e;letter-spacing:1px}</style></defs><rect width="1200" height="1500" fill="url(#bg)"/><circle cx="1100" cy="80" r="240" fill="#65d6ad" opacity=".08"/><circle cx="70" cy="1410" r="260" fill="#65d6ad" opacity=".06"/><text x="70" y="76" class="k">HOW TO FISH GAME GUIDE</text><rect x="70" y="120" width="170" height="55" rx="14" fill="#65d6ad"/><text x="155" y="158" text-anchor="middle" class="part">PART 01</text><text x="70" y="248" class="title">YOUR FIRST SURVIVAL LOOP</text><text x="70" y="300" class="lead">Stabilize hunger, health, and cash before chasing rare catches.</text><g transform="translate(70 360)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#65d6ad"/><text x="70" y="92" text-anchor="middle" class="num">1</text><text x="140" y="58" class="head">SURVIVE</text><text x="140" y="96" class="body">Watch hunger and health. Eat clams or catches before hunger reaches</text><text x="140" y="130" class="body">zero.</text></g><g transform="translate(70 550)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#65d6ad"/><text x="70" y="92" text-anchor="middle" class="num">2</text><text x="140" y="58" class="head">FIRST CASH</text><text x="140" y="96" class="body">Pick up clams near the Lighthouse. Hold Q to throw them to the</text><text x="140" y="130" class="body">merchant and get paid.</text></g><g transform="translate(70 740)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#65d6ad"/><text x="70" y="92" text-anchor="middle" class="num">3</text><text x="140" y="58" class="head">FIRST TOOL</text><text x="140" y="96" class="body">Save $6. Press E at the shop and buy the Crab Fishing Rod.</text></g><g transform="translate(70 930)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#65d6ad"/><text x="70" y="92" text-anchor="middle" class="num">4</text><text x="140" y="58" class="head">CATCH LOOP</text><text x="140" y="96" class="body">Right-click cast • hold left-click reel • right-click drop • press X</text><text x="140" y="130" class="body">• attack before it escapes.</text></g><g transform="translate(70 1120)"><rect width="1060" height="160" rx="28" fill="#102b3a" stroke="#315064" stroke-width="2"/><circle cx="70" cy="80" r="42" fill="#65d6ad"/><text x="70" y="92" text-anchor="middle" class="num">5</text><text x="140" y="58" class="head">CHECK PROGRESS</text><text x="140" y="96" class="body">Hold F to inspect weight and price. Press Tab to open the creature</text><text x="140" y="130" class="body">collection.</text></g><rect x="70" y="1345" width="1060" height="86" rx="25" fill="#65d6ad"/><text x="600" y="1399" text-anchor="middle" class="foot">NEXT: BAIT, LURES &amp; HOTSPOTS</text></svg>