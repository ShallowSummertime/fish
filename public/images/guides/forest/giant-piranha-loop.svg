<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Giant Piranha combat loop</title><desc id="d">Combat cycle showing clear ground, ranged movement, add control, a later phase after health is reduced, and drop recovery.</desc><rect width="1200" height="675" fill="#151b26"/><text x="70" y="85" fill="#ffcb69" font-family="system-ui,sans-serif" font-size="22" font-weight="700">GIANT PIRANHA · OBSERVED COMBAT LOOP</text><text x="70" y="135" fill="white" font-family="system-ui,sans-serif" font-size="40" font-weight="800">Move, control adds, protect the finish</text><g font-family="system-ui,sans-serif"><path d="M160 360a110 110 0 1 1 1 0" fill="none" stroke="#ffcb69" stroke-width="28" stroke-linecap="round"/><path d="M500 360a110 110 0 1 1 1 0" fill="none" stroke="#79d3b0" stroke-width="28" stroke-linecap="round"/><path d="M840 360a110 110 0 1 1 1 0" fill="none" stroke="#ef7b72" stroke-width="28" stroke-linecap="round"/><g fill="white" font-size="26" font-weight="750" text-anchor="middle"><text x="270" y="335">1 · KEEP MOVING</text><text x="610" y="335">2 · CLEAR ADDS</text><text x="950" y="335">3 · RECOVER</text></g><g fill="#cbd2df" font-size="18" text-anchor="middle"><text x="270" y="380">use open shoreline</text><text x="610" y="380">later phase; no threshold</text><text x="950" y="380">secure the Skeleton</text></g></g><rect x="70" y="540" width="1060" height="75" rx="14" fill="#252e3e"/><text x="100" y="588" fill="#fff" font-family="system-ui,sans-serif" font-size="21">Dynamite is a risky add-clear option: throw away from yourself and teammates; exact damage is not asserted.</text></svg>
