<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Forest progression route</title><desc id="d">A five-step field diagram from arrival and preparation through the leech request, Giant Piranha encounter, protected Skeleton, and departure check.</desc>
  <rect width="1200" height="675" fill="#10241f"/><path d="M0 480Q250 390 480 470T900 430T1200 470V675H0Z" fill="#1f5a45"/><circle cx="1030" cy="115" r="68" fill="#f4b65d"/>
  <text x="70" y="90" fill="#f4b65d" font-family="system-ui,sans-serif" font-size="22" font-weight="700">FOREST FIELD ROUTE</text><text x="70" y="140" fill="#fff" font-family="system-ui,sans-serif" font-size="42" font-weight="800">One dependency at a time</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle"><g fill="#f7f1df"><rect x="55" y="245" width="190" height="145" rx="18"/><rect x="280" y="245" width="190" height="145" rx="18"/><rect x="505" y="245" width="190" height="145" rx="18"/><rect x="730" y="245" width="190" height="145" rx="18"/><rect x="955" y="245" width="190" height="145" rx="18"/></g><g fill="#10241f" font-size="21" font-weight="750"><text x="150" y="290">ARRIVE</text><text x="375" y="290">NPC REQUEST</text><text x="600" y="290">BOSS BAIT</text><text x="825" y="290">KEEP DROP</text><text x="1050" y="290">CONFIRM EXIT</text></g><g fill="#3e554d" font-size="17"><text x="150" y="330">save · heal · space</text><text x="375" y="330">follow live counter</text><text x="600" y="330">Giant Piranha</text><text x="825" y="330">Skeleton</text><text x="1050" y="330">next marker</text></g><g fill="#f4b65d" font-size="34"><text x="262" y="330">→</text><text x="487" y="330">→</text><text x="712" y="330">→</text><text x="937" y="330">→</text></g></g>
  <text x="70" y="565" fill="#fff" font-family="system-ui,sans-serif" font-size="24" font-weight="700">Do not sell, eat, or abandon a unique progression item.</text><text x="70" y="603" fill="#c9ddd5" font-family="system-ui,sans-serif" font-size="19">The next marker is the completion signal—not the boss kill by itself.</text>
</svg>
