<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Forest recovery decision tree</title><desc id="d">Decision tree for a missing summon, failed boss attempt, missing Skeleton, or missing next marker.</desc><rect width="1200" height="675" fill="#f4efe2"/><text x="70" y="85" fill="#163f34" font-family="system-ui,sans-serif" font-size="22" font-weight="700">FOREST RECOVERY BOARD</text><text x="70" y="135" fill="#10241f" font-family="system-ui,sans-serif" font-size="40" font-weight="800">Diagnose before you recast</text><g font-family="system-ui,sans-serif"><g fill="#fff" stroke="#2f6b57" stroke-width="3"><rect x="70" y="215" width="500" height="120" rx="16"/><rect x="630" y="215" width="500" height="120" rx="16"/><rect x="70" y="390" width="500" height="120" rx="16"/><rect x="630" y="390" width="500" height="120" rx="16"/></g><g fill="#10241f" font-size="24" font-weight="750"><text x="100" y="258">NO BOSS?</text><text x="660" y="258">ATTEMPT FAILED?</text><text x="100" y="433">NO SKELETON?</text><text x="660" y="433">NO NEXT MARKER?</text></g><g fill="#3f514a" font-size="18"><text x="100" y="295">Recheck NPC request and equipped special bait.</text><text x="660" y="295">Heal, bank gear, clear a wider landing lane.</text><text x="100" y="470">Search fight area and inventory before repeating.</text><text x="660" y="470">Return to NPC with the unique drop in inventory.</text></g></g><text x="70" y="600" fill="#163f34" font-family="system-ui,sans-serif" font-size="23" font-weight="700">Save after the hand-in and after the destination marker appears.</text></svg>
