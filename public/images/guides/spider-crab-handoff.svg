<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Spider Crab reward hand-in</title><desc id="desc">An original diagram that separates the Spider Crab shell quest item from ordinary meat and shows the shell leading to boat keys and radar.</desc><rect width="1200" height="675" fill="#06212a"/><g font-family="Arial,sans-serif"><text x="75" y="87" font-size="22" fill="#78d8bb" letter-spacing="3">AFTER THE FIGHT</text><text x="75" y="140" font-size="48" font-weight="700" fill="#e9e6d5">Keep the quest item moving.</text><rect x="75" y="205" width="315" height="242" rx="8" fill="#133a40" stroke="#78d8bb" stroke-width="3"/><path d="M179 314c0-72 104-72 104 0v67H179Z" fill="#f2b84b"/><path d="M154 326h154M173 286h116" stroke="#06212a" stroke-width="9"/><text x="232" y="490" text-anchor="middle" font-size="29" font-weight="700" fill="#e9e6d5">SHELL</text><text x="232" y="523" text-anchor="middle" font-size="18" fill="#b7c8c1">hand it to the fisherman</text><path d="M425 326h178" stroke="#f2b84b" stroke-width="10"/><polygon points="604,306 666,326 604,347" fill="#f2b84b"/><rect x="694" y="205" width="390" height="242" rx="8" fill="#133a40" stroke="#f2b84b" stroke-width="3"/><path d="M815 304h108v55H815z" fill="#f2b84b"/><path d="M880 279v27M848 331l-22 26M890 331l22 26" stroke="#f2b84b" stroke-width="11"/><text x="889" y="490" text-anchor="middle" font-size="29" font-weight="700" fill="#e9e6d5">BOAT KEYS</text><text x="889" y="523" text-anchor="middle" font-size="18" fill="#b7c8c1">then buy and use the radar</text><text x="76" y="614" font-size="21" fill="#ed8064">Meat is ordinary loot. The shell is the progression hand-in.</text></g></svg>
